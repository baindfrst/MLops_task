name: Run Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install "dvc[s3]"

      - name: Verify DVC + remotes
        shell: bash
        run: |
          set -euo pipefail
          dvc --version
          dvc remote list
      - name: Configure MinIO remote for CI (local config only)
        shell: bash
        env:
          MINIO_ENDPOINT_URL: ${{ secrets.MINIO_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          dvc remote list | grep -E '^minio\s' || (echo "Remote 'minio' not found. Check .dvc/config" && exit 1)
          dvc remote modify --local minio endpointurl "${MINIO_ENDPOINT_URL}"
          dvc remote modify --local minio use_ssl false
          dvc remote modify --local minio s3_use_multipart_upload true
          dvc config --local --list

      - name: DVC pull (datasets/models)
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          dvc pull -v

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q
